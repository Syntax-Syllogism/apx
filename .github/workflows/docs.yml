name: Docs site

on:
  push:
    branches: [master, release]
    paths: ['docs/**', 'docs-site/**', '.github/workflows/docs.yml']
  workflow_dispatch:

jobs:
  docs:
    # The release branch is pushed to both the private origin and the public
    # mirror, so the repository must be checked as well as the ref.
    if: github.repository == 'Syntax-Syllogism/apx' && github.ref == 'refs/heads/release'
    uses: Syntax-Syllogism/workflows/.github/workflows/docs-publish.yml@workflows/v1
    with:
      tool_slug: 'apx'
      public_repo: 'Syntax-Syllogism/apx'
      site_repo: 'Syntax-Syllogism/Syntax-Syllogism.github.io'
    secrets: inherit
